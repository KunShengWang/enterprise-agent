spring:
  application:
    name: enterprise-agent
  ai:
    model:
      chat: deepseek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
        temperature: 0.2
        max-tokens: 1200

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

enterprise-agent:
  mock-mode: false
  max-model-calls-per-run: 8
  max-tool-calls-per-run: 6
  default-system-prompt: >
    You are an enterprise knowledge-base and support-ticket agent.
    Follow the orchestrated execution flow and do not bypass guardrails.
  rag:
    mode: pgvector
    document-dir: ${RAG_DOCUMENT_DIR:data/rag-docs}
    report-dir: ${RAG_REPORT_DIR:data/rag-reports}
    chunk-size: 500
    chunk-overlap: 80
    top-k: 3
    min-similarity: 0.2
    hybrid:
      enabled: true
      vector-candidate-multiplier: 4
      keyword-candidate-limit: 20
      vector-weight: 0.7
      keyword-weight: 0.3
    rerank:
      enabled: true
      base-score-weight: 0.75
      query-coverage-weight: 0.2
      source-match-weight: 0.05
    index:
      type: hnsw
      ivfflat-lists: 100
    datasource:
      url: ${RAG_POSTGRES_URL:jdbc:postgresql://localhost:5432/enterprise_agent}
      username: ${RAG_POSTGRES_USERNAME:postgres}
      password: ${RAG_POSTGRES_PASSWORD:1234}
    embedding:
      base-url: ${EMBEDDING_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      path: ${EMBEDDING_PATH:/embeddings}
      api-key: ${EMBEDDING_API_KEY:${ZHIPU_API_KEY:}}
      model: ${EMBEDDING_MODEL:embedding-3}
      dimension: ${EMBEDDING_DIMENSION:1024}
llm:
  http-log:
    enabled: true
