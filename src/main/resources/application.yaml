spring:
  application:
    name: enterprise-agent
  ai:
    model:
      chat: deepseek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
        temperature: 0.2
        max-tokens: 1200

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info

enterprise-agent:
  mock-mode: false
  max-turns-per-run: ${AGENT_MAX_TURNS_PER_RUN:12}
  max-model-calls-per-run: 8
  max-tool-calls-per-run: 6
  max-input-tokens-per-run: ${AGENT_MAX_INPUT_TOKENS_PER_RUN:24000}
  max-output-tokens-per-run: ${AGENT_MAX_OUTPUT_TOKENS_PER_RUN:8000}
  model-context-window-tokens: ${AGENT_MODEL_CONTEXT_WINDOW_TOKENS:32000}
  context-output-reserve-tokens: ${AGENT_CONTEXT_OUTPUT_RESERVE_TOKENS:2000}
  context-safety-margin-tokens: ${AGENT_CONTEXT_SAFETY_MARGIN_TOKENS:1000}
  context-summary-max-tokens: ${AGENT_CONTEXT_SUMMARY_MAX_TOKENS:1500}
  max-context-overflow-retries: ${AGENT_CONTEXT_OVERFLOW_RETRIES:1}
  # Cost limiting is opt-in because provider prices change. Configure both prices and a positive limit.
  max-estimated-cost-per-run: ${AGENT_MAX_ESTIMATED_COST_PER_RUN:0}
  model-pricing:
    input-per-million-tokens: ${LLM_INPUT_COST_PER_MILLION_TOKENS:0}
    output-per-million-tokens: ${LLM_OUTPUT_COST_PER_MILLION_TOKENS:0}
    cache-read-per-million-tokens: ${LLM_CACHE_READ_COST_PER_MILLION_TOKENS:0}
    cache-write-per-million-tokens: ${LLM_CACHE_WRITE_COST_PER_MILLION_TOKENS:0}
  max-run-duration-millis: ${AGENT_MAX_RUN_DURATION_MILLIS:120000}
  approval-ttl-seconds: ${AGENT_APPROVAL_TTL_SECONDS:86400}
  max-tool-execution-attempts: ${AGENT_TOOL_MAX_ATTEMPTS:2}
  tool-retry-backoff-millis: ${AGENT_TOOL_RETRY_BACKOFF_MILLIS:150}
  replan-after-tool-failure: ${AGENT_TOOL_REPLAN_AFTER_FAILURE:true}
  stream-backpressure-buffer-size: ${AGENT_STREAM_BACKPRESSURE_BUFFER_SIZE:256}
  stream-heartbeat-seconds: ${AGENT_STREAM_HEARTBEAT_SECONDS:10}
  max-tool-result-chars-for-model: ${AGENT_MAX_TOOL_RESULT_CHARS_FOR_MODEL:12000}
  max-tool-error-chars-for-model: ${AGENT_MAX_TOOL_ERROR_CHARS_FOR_MODEL:2000}
  resilience:
    rate-limit:
      enabled: ${AGENT_RATE_LIMIT_ENABLED:true}
      max-requests-per-minute: ${AGENT_RATE_LIMIT_PER_MINUTE:60}
    llm:
      max-attempts: ${LLM_MAX_ATTEMPTS:3}
      timeout-millis: ${LLM_TIMEOUT_MILLIS:10000}
      backoff-millis: ${LLM_BACKOFF_MILLIS:300}
      fallback-enabled: ${LLM_FALLBACK_ENABLED:true}
      executor-threads: ${LLM_EXECUTOR_THREADS:8}
      executor-queue-capacity: ${LLM_EXECUTOR_QUEUE_CAPACITY:64}
      circuit-breaker-failure-threshold: ${LLM_CIRCUIT_FAILURE_THRESHOLD:5}
      circuit-breaker-open-millis: ${LLM_CIRCUIT_OPEN_MILLIS:30000}
      fallback-message: ${LLM_FALLBACK_MESSAGE:AI 服务暂时不可用，请稍后重试。}
  default-system-prompt: >
    You are an enterprise knowledge-base and support-ticket agent.
    Follow the orchestrated execution flow and do not bypass guardrails.
  ordercare:
    floworder-base-url: ${FLOWORDER_BASE_URL:http://localhost:8081}
    connect-timeout-millis: ${FLOWORDER_CONNECT_TIMEOUT_MILLIS:1000}
    read-timeout-millis: ${FLOWORDER_READ_TIMEOUT_MILLIS:3000}
    inspect-max-attempts: ${FLOWORDER_INSPECT_MAX_ATTEMPTS:2}
    inspect-retry-backoff-millis: ${FLOWORDER_INSPECT_RETRY_BACKOFF_MILLIS:150}
    convergence-max-attempts: ${ORDERCARE_CONVERGENCE_MAX_ATTEMPTS:8}
    convergence-interval-millis: ${ORDERCARE_CONVERGENCE_INTERVAL_MILLIS:500}
    reconciliation-max-attempts: ${ORDERCARE_RECONCILIATION_MAX_ATTEMPTS:8}
    reconciliation-interval-millis: ${ORDERCARE_RECONCILIATION_INTERVAL_MILLIS:500}
  memory:
    long-term-candidate-limit: 40
    profile-item-limit: 30
    semantic-weight: 0.75
    lexical-weight: 0.10
    minimum-recall-score: 0.30
    datasource:
      url: ${MEMORY_POSTGRES_URL:${RAG_POSTGRES_URL:jdbc:postgresql://localhost:5432/enterprise_agent}}
      username: ${MEMORY_POSTGRES_USERNAME:${RAG_POSTGRES_USERNAME:postgres}}
      password: ${MEMORY_POSTGRES_PASSWORD:${RAG_POSTGRES_PASSWORD:}}
  storage:
    datasource:
      url: ${AGENT_STORAGE_POSTGRES_URL:${RAG_POSTGRES_URL:jdbc:postgresql://localhost:5432/enterprise_agent}}
      username: ${AGENT_STORAGE_POSTGRES_USERNAME:${RAG_POSTGRES_USERNAME:postgres}}
      password: ${AGENT_STORAGE_POSTGRES_PASSWORD:${RAG_POSTGRES_PASSWORD:}}
  tool-policy:
    default-decision: allow
    decisions:
      ticket_priority_update: ask
      ticket_close: ask
    admin-only-tools: []
    allowed-filesystem-roots:
      - ${MCP_FILESYSTEM_ROOT:D:/JDK/IDEA/java_reinforcement_learning/enterprise-agent/data/mcp-sandbox}
    allowed-network-hosts: []
  mcp:
    enabled: false
    server-name: filesystem
    tool-name-prefix: mcp.filesystem.
    protocol-version: "2025-11-25"
    command: ${MCP_STDIO_COMMAND:}
    args: []
    working-directory: ${MCP_WORKING_DIRECTORY:}
    servers:
      - enabled: true
        server-name: filesystem
        tool-name-prefix: mcp.filesystem.
        protocol-version: "2025-11-25"
        command: ${MCP_FILESYSTEM_COMMAND:node}
        args:
          - ${MCP_NPX_CLI:D:/NodeJS/24.11/setup/node_modules/npm/bin/npx-cli.js}
          - -y
          - "@modelcontextprotocol/server-filesystem"
          - ${MCP_FILESYSTEM_ROOT:D:/JDK/IDEA/java_reinforcement_learning/enterprise-agent/data/mcp-sandbox}
        working-directory: ${MCP_FILESYSTEM_WORKING_DIRECTORY:}
      - enabled: true
        server-name: ticket
        tool-name-prefix: mcp.ticket.
        protocol-version: "2025-11-25"
        command: ${MCP_TICKET_COMMAND:java}
        args:
          - -cp
          - ${MCP_TICKET_CLASSPATH:target/classes}
          - com.agent.platform.mcp.server.TicketMcpServerApplication
        working-directory: ${MCP_TICKET_WORKING_DIRECTORY:}
  rag:
    document-dir: ${RAG_DOCUMENT_DIR:data/rag-docs}
    report-dir: ${RAG_REPORT_DIR:data/rag-reports}
    chunk-size: 500
    chunk-overlap: 80
    top-k: 3
    min-similarity: 0.2
    hybrid:
      enabled: true
      vector-candidate-multiplier: 4
      keyword-candidate-limit: 20
      vector-weight: 0.7
      keyword-weight: 0.3
    rerank:
      enabled: true
      semantic-weight: 0.65
      max-candidates: 20
      max-snippet-chars: 1200
      base-score-weight: 0.75
      query-coverage-weight: 0.2
      source-match-weight: 0.05
    index:
      type: hnsw
      ivfflat-lists: 100
    cache:
      enabled: ${RAG_CACHE_ENABLED:true}
      ttl-seconds: ${RAG_CACHE_TTL_SECONDS:600}
      max-entries: ${RAG_CACHE_MAX_ENTRIES:1000}
    datasource:
      url: ${RAG_POSTGRES_URL:jdbc:postgresql://localhost:5432/enterprise_agent}
      username: ${RAG_POSTGRES_USERNAME:postgres}
      password: ${RAG_POSTGRES_PASSWORD:}
    embedding:
      base-url: ${EMBEDDING_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      path: ${EMBEDDING_PATH:/embeddings}
      api-key: ${EMBEDDING_API_KEY:${ZHIPU_API_KEY:}}
      model: ${EMBEDDING_MODEL:embedding-3}
      dimension: ${EMBEDDING_DIMENSION:1024}
llm:
  http-log:
    enabled: ${LLM_HTTP_LOG_ENABLED:false}
